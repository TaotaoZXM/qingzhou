# GitHub Pages cannot run the Qingzhou API. Pushing to main no longer deploys.
# Canonical hosting is Alibaba Cloud ECS. See deploy/README.md.
# workflow_dispatch still publishes the static shell for an offline demo.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p site/assets
          cp index.html sw.js manifest.json icon.svg favicon-32.png apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png site/
          cp assets/* site/assets/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
