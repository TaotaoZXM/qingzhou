# Qingzhou: static PWA plus /api reverse proxy.
# Replace example.com with the real domain, then:
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d example.com
# or uncomment the 443 server below and fill in the certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /opt/qingzhou;
    index index.html;
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/(?:server|deploy|\.git|\.github|node_modules|docs)(?:/|$) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

