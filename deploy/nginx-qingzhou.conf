# Qingzhou. nginx 1.24 on the Aliyun ECS.
#
# Do not install this file until the certificate exists. nginx -t fails if the
# PEM files are missing. deploy/enable-https.sh requests the cert with the
# current port-80 webroot, then copies this file into conf.d.
#
# Cert lineage (first name / --cert-name):
#   /etc/letsencrypt/live/myqingzhou.com/fullchain.pem
#   /etc/letsencrypt/live/myqingzhou.com/privkey.pem
# Cover both myqingzhou.com and www.myqingzhou.com.
#
# Public app URL (apex and www, HTTPS):
#   https://myqingzhou.com/taskmanager/
#   https://www.myqingzhou.com/taskmanager/
# `/` and `/index.html` on those names 301 to `/taskmanager/` and keep the
# query string, so an old bookmark and /?login=1 still land on the app.
# `/taskmanager` (no slash) 301s to `/taskmanager/` so relative assets, the
# manifest, and the service worker resolve inside that directory.
# Files under the prefix are the site root (/opt/qingzhou). Missing paths
# return index.html. /api/ stays at the origin root; the page calls /api.
#
# http://121.41.63.67/ stays on HTTP and keeps serving the app at /.
# The same host also serves /taskmanager/ and does not redirect /.
# Port 80 on the domain names still 301s to HTTPS (except the ACME webroot);
# the slash redirect happens after TLS.

server {
    listen 80;
    server_name 121.41.63.67;

    root /opt/qingzhou;
    index index.html;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/(?:taskmanager/)?(?:server|deploy|\.git|\.github|node_modules|docs)(?:/|$) {
        deny all;
    }

    location = /taskmanager {
        return 301 /taskmanager/$is_args$args;
    }

    location /taskmanager/ {
        alias /opt/qingzhou/;
        try_files $uri $uri/ @taskmanager_spa;
    }

    location @taskmanager_spa {
        root /opt/qingzhou;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name myqingzhou.com www.myqingzhou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name myqingzhou.com www.myqingzhou.com;

    ssl_certificate     /etc/letsencrypt/live/myqingzhou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myqingzhou.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/qingzhou;
    index index.html;
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/(?:taskmanager/)?(?:server|deploy|\.git|\.github|node_modules|docs)(?:/|$) {
        deny all;
    }

    # Exact matches, so the named SPA fallback can still serve index.html
    # without this redirect turning an internal rewrite into a browser hop.
    location = / {
        return 301 /taskmanager/$is_args$args;
    }

    location = /index.html {
        return 301 /taskmanager/$is_args$args;
    }

    location = /taskmanager {
        return 301 /taskmanager/$is_args$args;
    }

    location /taskmanager/ {
        alias /opt/qingzhou/;
        try_files $uri $uri/ @taskmanager_spa;
    }

    location @taskmanager_spa {
        root /opt/qingzhou;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ @root_spa;
    }

    location @root_spa {
        root /opt/qingzhou;
        try_files /index.html =404;
    }
}
