# Qingzhou. nginx 1.24 on the Aliyun ECS.
#
# Do not install this file until the certificate exists. nginx -t fails if the
# PEM files are missing. deploy/enable-https.sh requests the cert with the
# current port-80 webroot, then copies this file into conf.d.
#
# Cert lineage (first name / --cert-name):
#   /etc/letsencrypt/live/myqingzhou.com/fullchain.pem
#   /etc/letsencrypt/live/myqingzhou.com/privkey.pem
# Cover both myqingzhou.com and www.myqingzhou.com.
#
# http://121.41.63.67/ stays on HTTP. The domain redirects to HTTPS except
# for the ACME webroot, which renewal still uses.

server {
    listen 80;
    server_name 121.41.63.67;

    root /opt/qingzhou;
    index index.html;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/(?:server|deploy|\.git|\.github|node_modules|docs)(?:/|$) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name myqingzhou.com www.myqingzhou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name myqingzhou.com www.myqingzhou.com;

    ssl_certificate     /etc/letsencrypt/live/myqingzhou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myqingzhou.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/qingzhou;
    index index.html;
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/(?:server|deploy|\.git|\.github|node_modules|docs)(?:/|$) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
